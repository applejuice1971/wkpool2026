<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="394" viewBox="0 0 1000 394" role="img" aria-labelledby="title desc">
  <title id="title">KO-schema FIFA WK 2026</title>
  <desc id="desc">Knock-outschema van het FIFA WK voetbal 2026.</desc>
  <defs>
    <style>
      :root{--ink:#10243f;--muted:#607086;--line:#9aa9bc;--r32:#e9f6ff;--r16:#eef8ef;--qf:#fff6df;--sf:#f5ecff;--final:#006bff;--bronze:#f7f2ea}
      .bg{fill:#f7f9fc}.title{font:800 24px Arial,sans-serif;fill:var(--ink)}.sub{font:12px Arial,sans-serif;fill:var(--muted)}
      .hdr{font:700 11px Arial,sans-serif;fill:#34445c;letter-spacing:.05em}
